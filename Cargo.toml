[package]
name = "zlid"
version = "0.0.1-rc.4"
edition = "2021"
rust-version = "1.88"
description = "Canonical, sortable, collision-resistant identifiers for Rust"
license = "Apache-2.0"
repository = "https://github.com/zsumz/zlid"
documentation = "https://docs.rs/zlid"
readme = "README.md"
keywords = ["zlid", "identifier", "sortable", "alias"]
categories = ["data-structures", "encoding"]
include = [
  "benches/**/*.rs",
  "src/**/*.rs",
  "tests/**/*.rs",
  "examples/**/*.rs",
  "conformance/*.json",
  "conformance/*.md",
  "conformance/*.sha256",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[lib]
name = "zlid"
path = "src/lib.rs"

[[bench]]
name = "hot-paths"
path = "benches/hot_paths.rs"
harness = false

[dependencies]
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }

[features]
default = []
wasm-js = ["getrandom/wasm_js", "dep:js-sys"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3.104", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
