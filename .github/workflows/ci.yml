name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: release gate / stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          update: false
      - name: Set up zrail
        uses: zactionsz/setup-zrail@e6f8b7b742b94d4d42ed1133df500f75eb465aa2
        with:
          version: "0.0.2"
          sha256: fb535cf8a72cf15995f0c4d2ea640629624b300736c67c7961e058f4a12419d9
      - name: Set up zcheck
        uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: "0.0.2"
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - name: Run zcheck-backed release gate
        run: scripts/check-release

  msrv:
    name: MSRV / 1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: 1.88.0
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets

  platform:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets
