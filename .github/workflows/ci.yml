name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: release gate / stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          update: false
      - name: Set up ripgrep
        env:
          RIPGREP_REVISION: e89fff89ac
          RIPGREP_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
          RIPGREP_TARGET: x86_64-unknown-linux-musl
          RIPGREP_VERSION: 15.2.0
        run: |
          archive_root="ripgrep-${RIPGREP_VERSION}-${RIPGREP_TARGET}"
          archive="${archive_root}.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/ripgrep-bin"
          release="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive_path" "$release/$archive"
          printf '%s  %s\n' "$RIPGREP_SHA256" "$archive_path" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" --strip-components=1 \
            -C "$install_dir" "$archive_root/rg"
          version_line="$("$install_dir/rg" --version | head -n 1)"
          test "$version_line" = \
            "ripgrep $RIPGREP_VERSION (rev $RIPGREP_REVISION)"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Set up zrail
        env:
          ZRAIL_SHA256: c8913f434d046195e873d24aea36669db81b19cf8fabe422564fe770bdc0b01e
          ZRAIL_TARGET: x86_64-unknown-linux-gnu
          ZRAIL_VERSION: 0.0.3-rc.4
        run: |
          archive="zrail-${ZRAIL_VERSION}-${ZRAIL_TARGET}.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/zrail-bin"
          release="https://github.com/zsumz/zrail/releases/download/v${ZRAIL_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive_path" "$release/$archive"
          printf '%s  %s\n' "$ZRAIL_SHA256" "$archive_path" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" zrail
          test "$("$install_dir/zrail" --version)" = "zrail $ZRAIL_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Set up zcheck
        uses: zsumz/zcheck/.github/actions/setup-zcheck@4ca5e71db9974972d4d59349550a6d25a8dc7e90
        with:
          version: "0.0.2"
          sha256: a9e3ca964b6f5e86c693edeff4aeaddb46ee9d62f8713d3ded0bb6533b758e53
      - name: Run zcheck-backed release gate
        run: scripts/check-release

  msrv:
    name: MSRV / 1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: 1.88.0
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets

  wasm:
    name: WebAssembly / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, 1.88.0]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: ${{ matrix.toolchain }}
          profile: minimal
          targets: wasm32-unknown-unknown
          update: false
      - name: Set up wasm-bindgen test runner
        if: matrix.toolchain == 'stable'
        env:
          WASM_BINDGEN_SHA256: 61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a
          WASM_BINDGEN_TARGET: x86_64-unknown-linux-musl
          WASM_BINDGEN_VERSION: 0.2.127
        run: |
          archive_root="wasm-bindgen-${WASM_BINDGEN_VERSION}-${WASM_BINDGEN_TARGET}"
          archive="${archive_root}.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/wasm-bindgen-bin"
          release="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive_path" "$release/$archive"
          printf '%s  %s\n' "$WASM_BINDGEN_SHA256" "$archive_path" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" --strip-components=1 -C "$install_dir" \
            "$archive_root/wasm-bindgen" \
            "$archive_root/wasm-bindgen-test-runner"
          test "$("$install_dir/wasm-bindgen" --version)" = \
            "wasm-bindgen $WASM_BINDGEN_VERSION"
          echo "$install_dir" >> "$GITHUB_PATH"
      - run: >-
          cargo check --locked --target wasm32-unknown-unknown
          --features wasm-js
      - name: Run WebAssembly APIs under Node.js
        if: matrix.toolchain == 'stable'
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: >-
          cargo test --locked --target wasm32-unknown-unknown
          --features wasm-js --test wasm_runtime

  platform:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets

  required:
    name: required
    if: ${{ always() }}
    needs: [release-gate, msrv, wasm, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job group
        env:
          MSRV_RESULT: ${{ needs.msrv.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          RELEASE_GATE_RESULT: ${{ needs.release-gate.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
        run: |
          printf '%s\n' \
            "release-gate=$RELEASE_GATE_RESULT" \
            "msrv=$MSRV_RESULT" \
            "wasm=$WASM_RESULT" \
            "platform=$PLATFORM_RESULT"
          test "$RELEASE_GATE_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$WASM_RESULT" = success
          test "$PLATFORM_RESULT" = success
