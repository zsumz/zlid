name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: release gate / stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy
          update: false
      - run: scripts/check-release

  msrv:
    name: MSRV / 1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: 1.88.0
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets

  platform:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: zactionsz/setup-rust@8a57ecfd865b04df6fd794ba3a40049c2c563867
        with:
          toolchain: stable
          profile: minimal
          update: false
      - run: cargo test --locked --all-targets
